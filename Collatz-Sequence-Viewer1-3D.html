<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Multidimensional Collatz Logarithmic Unified Chart (1D / 2D / 3D)</title>
    <style>
        body { font-family: sans-serif; background: #f8fafc; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .box { border: 1px solid #000; padding: 24px; background: #fff; border-radius: 8px; width: 100%; max-width: 950px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .panel { background: #f1f5f9; padding: 12px; border-radius: 6px; text-align: center; margin-bottom: 12px; font-weight: bold; display: flex; justify-content: center; align-items: center; gap: 20px; flex-wrap: wrap; }
        .legend { display: flex; gap: 20px; justify-content: flex-start; margin-bottom: 20px; font-size: 11px; padding-left: 4px; flex-wrap: wrap; }
        .item { display: flex; align-items: center; gap: 6px; }
        .line { width: 25px; height: 3px; display: inline-block; }
        .l-val { background: #000; }
        .l-gen { background: #dc2626; border-top: 2px dashed #dc2626; height: 0; }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .d-even { background: #000; }
        .d-4n3 { background: #2563eb; }
        .d-4n1 { background: #dc2626; }
        svg { background: #fafafa; border: 1px solid #cbd5e1; border-radius: 4px; width: 100%; height: auto; }
        .output { margin-top: 16px; text-align: right; font-weight: bold; font-size: 13px; border-top: 1px solid #cbd5e1; padding-top: 12px; line-height: 1.6; }
        select { font-size: 14px; font-weight: bold; padding: 4px 10px; border-radius: 4px; border: 1px solid #cbd5e1; cursor: pointer; }
    </style>
</head>
<body>
<div class="box">
    <div class="panel">
        <div>
            Input Seed N : <input type="number" id="inputN" value="27" min="1" style="width:100px; text-align:center; font-size:15px; font-weight:bold;">
        </div>
        <div>
            Dimension Space : 
            <select id="dimSelect">
                <option value="3D" selected>3D (Generation vertices: 4n+1 only)</option>
                <option value="2D">2D (Generation vertices: Odd numbers only)</option>
                <option value="1D">1D (Generation vertices: All natural number)</option>
            </select>
        </div>
    </div>
    <div class="legend">
        <div class="item"><span class="line l-val"></span><span style="color:#000; font-weight:bold;">Value Trajectory</span></div>
        <div class="item"><span class="line l-gen"></span><span style="color:#dc2626; font-weight:bold;">Generation Index K</span></div>
        <div class="item"><span class="dot d-even"></span><span style="font-weight:bold;">Even (Black Circle)</span></div>
        <div class="item"><span class="dot d-4n3"></span><span style="color:#2563eb; font-weight:bold;">4n+3 (Blue Circle)</span></div>
        <div class="item"><span class="dot d-4n1"></span><span style="color:#dc2626; font-weight:bold;">4n+1 (Red Circle/Dot)</span></div>
    </div>
    <div style="width: 100%; height: 500px; background: #fafafa;">
        <svg id="chart" viewBox="0 0 900 500" width="100%" height="500" style="border: 1px solid #cbd5e1; border-radius: 4px; display: block;"></svg>
    </div>
    <div class="output" id="status"></div>
</div>

<script>
    function calculateData(seed, dim) {
        let val = BigInt(seed); 
        if (val < 1n) return null;
        
        let steps = [val];
        let genIndices = [];

        if (dim === '1D') {
            // 1D: Peano Space (偶奇関係なく N -> N-1 -> ... -> 1)
            while (val > 1n) {
                val = val - 1n;
                steps.push(val);
            }
            genIndices = new Array(steps.length);
            for (let i = 0; i < steps.length; i++) {
                genIndices[i] = steps.length - 1 - i;
            }
            return { steps, genIndices, maxGen: steps.length - 1 };

        } else if (dim === '2D') {
            // 2D: 簡易コラッツ (奇数なら x + 1, 偶数なら x / 2)
            while (val > 1n) {
                val = (val % 2n === 0n) ? (val / 2n) : (val + 1n);
                steps.push(val);
            }
            genIndices = new Array(steps.length);
            genIndices[steps.length - 1] = 0;
            let currentGen = 0;
            for (let i = steps.length - 2; i >= 0; i--) {
                let nextVal = steps[i + 1];
                if (nextVal === 1n || nextVal % 2n === 1n) {
                    currentGen++;
                }
                genIndices[i] = currentGen;
            }
            return { steps, genIndices, maxGen: currentGen };

        } else if (dim === '3D') {
            // 3D: 本来のコラッツ (奇数なら 3x + 1, 偶数なら x / 2)
            while (val > 1n) {
                val = (val % 2n === 0n) ? (val / 2n) : (3n * val + 1n);
                steps.push(val);
            }
            genIndices = new Array(steps.length);
            genIndices[steps.length - 1] = 0;
            let currentGen = 0;
            for (let i = steps.length - 2; i >= 0; i--) {
                let nextVal = steps[i + 1];
                if (nextVal === 1n || nextVal % 4n === 1n) {
                    currentGen++;
                }
                genIndices[i] = currentGen;
            }
            return { steps, genIndices, maxGen: currentGen };
        }
    }

    function classify(num) {
        if (num % 2n === 0n) return 'even';
        if (num % 4n === 1n) return 'odd4n1';
        return 'odd4n3';
    }

    function render() {
        const inputVal = document.getElementById('inputN').value;
        const seedVal = parseInt(inputVal) || 27;
        const dimVal = document.getElementById('dimSelect').value;

        const data = calculateData(seedVal, dimVal);
        if (!data) return;

        const { steps, genIndices, maxGen } = data;
        const totalSteps = Math.max(1, steps.length - 1);

        let maxVal = 0n;
        steps.forEach(v => { if (v > maxVal) maxVal = v; });

        const chartMax = Math.max(Number(maxVal), seedVal, maxGen, 10);
        const logMax = Math.log10(chartMax);
        const logMin = 0;

        const w = 900, h = 500;
        const top = 40, bot = 90, left = 80, right = 40;
        const graphW = w - left - right;
        const graphH = h - top - bot;

        const getX = (i) => left + (i / totalSteps) * graphW;
        const getYLog = (val) => {
            const num = Math.max(1, Number(val));
            const logNum = Math.log10(num);
            return top + graphH - ((logNum - logMin) / (logMax - logMin)) * graphH;
        };

        let svg = '';

        // 水平グリッド
        for (let i = 0; i <= 4; i++) {
            const y = top + (i / 4) * graphH;
            svg += `<line x1="${left}" y1="${y}" x2="${w - right}" y2="${y}" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>`;
        }

        const addText = (x, y, txt, anchor, color, size = "11", weight = "bold", transform = "") => {
            let transAttr = transform ? ` transform="${transform}"` : '';
            svg += `<text x="${x}" y="${y}" text-anchor="${anchor}" fill="${color}" font-size="${size}" font-weight="${weight}"${transAttr}>${txt}</text>`;
        };

        // 世代境界の縦線・インデックス描写
        steps.forEach((v, idx) => {
            let isTrigger = false;
            if (dimVal === '3D') isTrigger = (idx > 0 && v % 4n === 1n) || (idx === 0 && v % 4n === 1n) || idx === totalSteps;
            else if (dimVal === '2D') isTrigger = (idx > 0 && v % 2n === 1n) || (idx === 0 && v % 2n === 1n) || idx === totalSteps;
            else if (dimVal === '1D') isTrigger = true;

            if (isTrigger) {
                const x = getX(idx).toFixed(1);
                svg += `<line x1="${x}" y1="${top}" x2="${x}" y2="${h - bot}" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 2"/>`;
                const yPos = h - bot + 14;
                addText(x, yPos, `${genIndices[idx]}`, "end", "#dc2626", "10", "bold", `rotate(-90, ${x}, ${yPos})`);
            }
        });

        // 軌跡パス
        let pathVal = '';
        let pathGen = '';
        let dotsSvg = '';

        steps.forEach((v, idx) => {
            const x = getX(idx).toFixed(1);
            const yV = getYLog(v).toFixed(1);
            const yG = getYLog(BigInt(genIndices[idx])).toFixed(1);

            if (idx === 0) {
                pathVal += `M ${x} ${yV}`;
                pathGen += `M ${x} ${yG}`;
            } else {
                pathVal += ` L ${x} ${yV}`;
                const prevYG = getYLog(BigInt(genIndices[idx - 1])).toFixed(1);
                pathGen += ` L ${x} ${prevYG} L ${x} ${yG}`;
            }

            const type = classify(v);
            let dotColor = '#000000';
            if (type === 'odd4n3') dotColor = '#2563eb';
            else if (type === 'odd4n1') dotColor = '#dc2626';

            dotsSvg += `<circle cx="${x}" cy="${yV}" r="3" fill="${dotColor}" />`;
        });

        svg += `<path d="${pathVal}" fill="none" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>`;
        svg += `<path d="${pathGen}" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="5 4"/>`;
        svg += dotsSvg;

        // 軸線
        svg += `<line x1="${left}" y1="${h - bot}" x2="${w - right}" y2="${h - bot}" stroke="#475569" stroke-width="1.5"/>`;
        svg += `<line x1="${left}" y1="${top}" x2="${left}" y2="${h - bot}" stroke="#475569" stroke-width="1.5"/>`;

        // Y軸テキストラベル
        addText(left - 10, top + 4, `Peak: ${maxVal}`, "end", "#000000");
        addText(left - 10, getYLog(seedVal) + 4, `N: ${seedVal}`, "end", "#16a34a");
        addText(left - 10, h - bot, "1", "end", "#475569");

        document.getElementById('chart').innerHTML = svg;

        const isOk = (seedVal === 1) ? (maxGen <= seedVal) : (maxGen < seedVal);
        status.innerHTML = `Active Dimension: <span style="color:#2563eb;">${dimVal} Space</span> | Peak Value = ${maxVal} | Seed N = ${seedVal} | Max Gen K = ${maxGen}<br>` +
            `Ceiling Constraint Evaluation (K < N): <span style='color:${isOk ? "#16a34a" : "#dc2626"}'>${isOk ? "✓ GEN K IS PERFECTLY UNDER THE CEILING N (BOUNDED)" : "⚠️ OVER BOUND (K >= N)"}</span>`;
    }

    document.getElementById('inputN').addEventListener('input', render);
    document.getElementById('dimSelect').addEventListener('change', render);
    window.addEventListener('DOMContentLoaded', render);
</script>
</body>
</html>
